<style>
:root{--bg:#fff;--soft:#F3F4F7;--line:#E4E6EC;--ink:#0B0F1F;--mute:#6B7080;--navy:#0B1640;--ice:#E9EDFB;--sans:'Raleway','Helvetica Neue',Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;--max:1240px;--pad:clamp(18px,4vw,48px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.1em}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{position:sticky}
.nav .in{position:relative;max-width:var(--max);margin:0 auto;padding:0 var(--pad);height:74px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1;text-decoration:none;color:var(--ink)}.logo .lw{font-size:22px;font-weight:600;letter-spacing:.08em;margin-right:-.08em}.logo .ls{font-size:9px;font-weight:500;letter-spacing:.42em;margin-right:-.42em;margin-top:4px;color:var(--mute)}
.nav nav{display:flex;gap:28px;font-size:15px;color:var(--mute)}
.nav nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:500 15px/1 var(--sans);padding:14px 22px;border-radius:999px;background:var(--navy);color:#fff}
.frame{max-width:var(--max);margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
footer{max-width:var(--max);margin:0 auto;padding:34px var(--pad) 44px;color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:860px){.nav .btn{display:none}.nav nav{display:none}.frame{border:0}}
.head{padding:clamp(70px,9vw,120px) var(--pad) clamp(40px,5vw,64px);border-bottom:1px solid var(--line)}
.kick{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--ink);padding-bottom:14px}
.head h1{font-size:clamp(64px,13vw,190px);font-weight:500;letter-spacing:-.06em;line-height:.9;margin-top:26px}
.head p{color:var(--mute);font-size:19px;max-width:52ch;margin-top:22px}
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,5vw,72px);align-items:center;padding:clamp(48px,6vw,80px) var(--pad);border-bottom:1px solid var(--line)}
.feat .fimg{overflow:hidden;border-radius:6px;background:var(--soft)}
.feat img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .9s ease}
.feat:hover img{transform:scale(1.03)}
.meta{display:flex;gap:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.feat h2{font-size:clamp(34px,4.4vw,60px);font-weight:500;letter-spacing:-.045em;line-height:1.02;margin-top:20px}
.feat p{color:var(--mute);font-size:18px;margin-top:18px;max-width:46ch}
.read{display:inline-block;margin-top:24px;font-family:var(--serif);font-style:italic;font-size:21px;color:var(--navy)}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.4vw,32px);padding:clamp(48px,6vw,80px) var(--pad)}
.card{border-top:1px solid var(--ink);padding-top:16px;display:flex;flex-direction:column}
.card .cimg{margin-top:16px;overflow:hidden;border-radius:6px;background:var(--soft)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .9s ease}
.card:hover img{transform:scale(1.04)}
.card h3{font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.15;margin-top:18px}
.card p{color:var(--mute);font-size:15px;margin-top:8px}
@media(max-width:860px){.feat,.list{grid-template-columns:1fr}}
.burger{display:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);cursor:pointer;align-items:center;justify-content:center}
.burger span{display:block;width:18px;height:1.6px;background:var(--ink);position:relative;transition:transform .25s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:1.6px;background:var(--ink);transition:transform .25s,top .25s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.nav.open .burger span{background:transparent}
.nav.open .burger span::before{top:0;transform:rotate(45deg)}
.nav.open .burger span::after{top:0;transform:rotate(-45deg)}
@media(max-width:960px){
  .burger{display:inline-flex}
  .nav.open nav{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 20px 40px -24px rgba(11,22,64,.3);padding:8px var(--pad) 20px}
  .nav.open nav a{padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;color:var(--ink)}
  .nav.open nav a:last-child{border-bottom:0}
}
</style>
</head>
<body>
<header class="nav"><div class="in">
  <a href="../index.html" class="logo"><span class="lw">VIGNAU</span><span class="ls">STUDIO</span></a>
  <nav><a href="../#exemples">Exemples</a><a href="../#cas">Projets</a><a href="../#tarifs">Offres</a><a href="index.html">Journal</a></nav>
  <span style="display:flex;gap:8px;align-items:center"><span class="langsw" style="display:inline-flex;gap:4px;font-size:13px;margin-right:6px"><button type="button" data-l="fr" style="border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;font:inherit;color:#6B7080">FR</button><button type="button" data-l="en" style="border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;font:inherit;color:#6B7080">EN</button></span><a href="https://calendly.com/vignaustudio/brand-audit" class="btn" id="jcta" target="_blank" rel="noopener">Book a call</a><button type="button" class="burger" aria-label="Menu" aria-expanded="false" onclick="var n=this.closest('.nav');var o=n.classList.toggle('open');this.setAttribute('aria-expanded',o)"><span></span></button></span>
</div></header>
<main class="frame">
  <section class="head">
    <div class="kick"><span>Vignau Studio</span><span>Journal</span></div>
    <h1>Le <em>Journal</em></h1>
    <p>Conseils concrets sur les visuels produit, l'image de marque et la vente en ligne, pour les marques beauté, mode et luxe.</p>
  </section>
  <div id="posts"></div>
</main>
<footer><span>© <span id="yr"></span> Vignau Studio</span><span><a href="../legal.html#mentions">Mentions légales</a> · <a href="../legal.html#cgv">CGV</a> · <a href="../legal.html#confidentialite">Confidentialité</a> · <a href="../index.html">Retour au site</a></span></footer>
<script>
/* VS-JOURNAL-I18N */
(function(){
  var S=window.SITE||{}, posts=(S.journal&&S.journal.posts)||[];
  var lang; try{lang=localStorage.getItem('vs-lang');}catch(e){}
  if(lang!=='fr'&&lang!=='en') lang=(S.defaultLang==='fr')?'fr':'en';
  var L={
    fr:{nav:['Exemples','Projets','Offres','Journal'],cta:'Réserver un appel',h1:'Le <em>Journal</em>',sub:"Stratégie de marque, direction artistique et créas qui vendent, pour les marques beauté, mode et luxe.",read:"Lire l'article →",empty:'Premiers articles très bientôt.',foot:['Mentions légales','CGV','Confidentialité','Retour au site'],loc:'fr-FR'},
    en:{nav:['Examples','Work','Offers','Journal'],cta:'Book a call',h1:'The <em>Journal</em>',sub:'Brand strategy, art direction and creatives that sell, for beauty, fashion and luxury brands.',read:'Read the article →',empty:'First articles coming soon.',foot:['Legal notice','Terms','Privacy','Back to site'],loc:'en-US'}
  };
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  function t(v){ return (v&&typeof v==='object')?(v[lang]||v.en||v.fr||''):(v||''); }
  function fmt(v){ return esc(t(v)).replace(/\*(.+?)\*/g,'<em>$1</em>'); }
  function d(s){ try{ return new Date(s).toLocaleDateString(L[lang].loc,{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return s; } }
  function u(p){ return '../'+t(p); }
  function img(p){ return '<img src="'+esc('../'+p.img)+'" alt="'+esc(t(p.title))+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">'; }
  function meta(p){ return '<div class="meta"><span>'+esc(t(p.cat))+'</span><span>'+esc(d(p.date))+'</span>'+(p.minutes?'<span>'+p.minutes+' min</span>':'')+'</div>'; }
  function draw(){
    var T=L[lang]; document.documentElement.lang=lang;
    document.querySelectorAll('.nav nav a').forEach(function(a,k){ if(T.nav[k]) a.textContent=T.nav[k]; });
    var cta=document.getElementById('jcta'); if(cta){ cta.textContent=T.cta; if(S.callUrl) cta.href=S.callUrl; }
    var h1=document.querySelector('.head h1'); if(h1) h1.innerHTML=T.h1;
    var sp=document.querySelector('.head p'); if(sp) sp.textContent=T.sub;
    var box=document.getElementById('posts');
    if(!posts.length){ box.innerHTML='<p style="padding:60px var(--pad);color:var(--mute)">'+T.empty+'</p>'; }
    else {
      var f=posts[0], rest=posts.slice(1);
      box.innerHTML='<a class="feat" href="'+esc(u(f.url))+'"><div class="fimg">'+img(f)+'</div><div>'+meta(f)+'<h2>'+fmt(f.title)+'</h2><p>'+fmt(f.excerpt)+'</p><span class="read">'+T.read+'</span></div></a>'+
        (rest.length?'<div class="list">'+rest.map(function(p){return '<a class="card" href="'+esc(u(p.url))+'">'+meta(p)+'<div class="cimg">'+img(p)+'</div><h3>'+fmt(p.title)+'</h3><p>'+fmt(p.excerpt)+'</p></a>';}).join('')+'</div>':'');
    }
    document.querySelectorAll('footer a').forEach(function(a,k){ if(T.foot[k]) a.textContent=T.foot[k]; });
    document.querySelectorAll('.langsw [data-l]').forEach(function(b){ var on=b.getAttribute('data-l')===lang; b.style.background=on?'#F3F4F7':'none'; b.style.color=on?'#0B0F1F':'#6B7080'; });
  }
  document.querySelectorAll('.langsw [data-l]').forEach(function(b){ b.addEventListener('click',function(){ lang=b.getAttribute('data-l'); try{localStorage.setItem('vs-lang',lang);}catch(e){} draw(); }); });
  draw();
  var yr=document.getElementById('yr'); if(yr) yr.textContent=new Date().getFullYear();
})();
</script>
<script>document.querySelectorAll('.nav nav a').forEach(function(a){a.addEventListener('click',function(){var n=document.querySelector('.nav');n.classList.remove('open');var b=n.querySelector('.burger');if(b)b.setAttribute('aria-expanded','false');});});</script>
</body>
